<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DEPARTURZ Portal</title>
<meta name="description" content="The DEPARTURZ client and crew portal.">
<meta name="theme-color" content="#0A0A0A">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32.png">
<link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,400..900&family=Big+Shoulders+Display:wght@900&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* One app, two doors. Clients get their project as a flight (boarding pass, check-in, fare);
   the crew get a lounge (comms, call sheet, cargo, payroll). Paper, ink, sky and violet, loud condensed type. */
:root{
  --paper:#FAFAF8; --card:#FFFFFF; --stone:#F1EFEA; --line:#E3E1DC; --line2:#D2CFC7; --ink:#0A0A0A; --ink2:#1A1A1D; --mute:#6B6A66;
  --sky:#3FB8EE; --skyink:#1C7FB0; --violet:#9E80F2; --vink:#6B4FD8; --sun:#F7C21B; --ok:#1F9D6B; --warn:#D9822B; --bad:#D2493C;
  --grad:linear-gradient(100deg,var(--sky) 6%,var(--violet) 92%);
  --f:"Archivo","Helvetica Neue",Arial,sans-serif; --f-cond:"Anton",Impact,"Arial Narrow",sans-serif;
  --f-mono:"Martian Mono",ui-monospace,Menlo,Consolas,monospace; --f-mark:"Big Shoulders Display","Arial Narrow",sans-serif;
  --side:252px; --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.mute{color:var(--mute)}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:22px 16px;background:var(--ink);color:#F2F0EB;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;text-decoration:none;font-family:var(--f-mark);font-weight:900;font-size:22px;letter-spacing:.05em;line-height:1}
.brand i{width:26px;height:26px;background:#F2F0EB;-webkit-mask:url(logo/mark.png) center / contain no-repeat;mask:url(logo/mark.png) center / contain no-repeat}
.wm{display:block;flex:none;height:.68em;aspect-ratio:1280 / 107;background:currentColor;-webkit-mask:url(logo/wordmark.svg) center / contain no-repeat;mask:url(logo/wordmark.svg) center / contain no-repeat;overflow:hidden;text-indent:110%;white-space:nowrap}
.door{display:inline-flex;align-self:flex-start;margin:-6px 8px 0;padding:4px 10px;border-radius:99px;background:var(--grad);color:var(--ink);font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.nav{display:grid;gap:2px}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:#BEBCB6;font-size:14.5px;font-weight:500;transition:background-color .15s,color .15s}
.nav a svg{width:19px;height:19px;flex:none}
.nav a:hover{background:#1C1C20;color:#fff}
.nav a[aria-current="page"]{background:#F2F0EB;color:var(--ink)}
.nav a .ct{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--violet);color:var(--ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.nav a[aria-current="page"] .ct{background:var(--ink);color:#fff}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:#17171A}
.av{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--grad);color:var(--ink);font-weight:800;font-size:13px;letter-spacing:.02em}
.av.lg{width:84px;height:84px;font-size:28px}
.av.sm{width:30px;height:30px;font-size:11px}
.th .av,.me .av{display:grid;place-items:center;color:var(--ink);font-weight:800;white-space:normal;overflow:visible}
.th .av{font-size:11px}.me .av{font-size:13px}
.me b{display:block;font-size:13.5px;line-height:1.2}
.me span{font-size:12px;color:#9C9A94}
.me a{margin-left:auto;font-size:11px;color:#9C9A94;text-decoration:none}
.me a:hover{color:#fff}
.main{min-width:0;padding:clamp(18px,3vw,36px) clamp(16px,3.4vw,44px) 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:clamp(18px,3vw,30px)}
.hello .mono{display:block;color:var(--mute);margin-bottom:4px}
.hello h1{margin:0;font-weight:900;font-stretch:72%;text-transform:uppercase;font-size:clamp(34px,4.6vw,58px);line-height:.9;letter-spacing:-.01em}
.top-act{display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--card)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--violet);border:2px solid var(--card)}
.preview{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:10px 14px;border-radius:12px;background:#EEF7FC;border:1px solid #CBE7F6;font-size:13px}
.preview b{font-weight:600}
.preview a{margin-left:auto;font-weight:600;color:var(--skyink);text-decoration:none;white-space:nowrap}
.tabbar{display:none}
.top-av{display:none;width:44px;height:44px;text-decoration:none}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2vw,22px);min-width:0}
.card.ink{background:var(--ink);color:#F2F0EB;border-color:var(--ink)}
.card.stone{background:var(--stone);border-color:var(--stone)}
.card h2,.card h3{margin:0}
.c-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.c-head h2{font-weight:900;font-stretch:72%;text-transform:uppercase;font-size:clamp(24px,2.4vw,30px);line-height:.95}
.c-head a,.c-head button.lnk{font-size:13px;font-weight:600;color:var(--skyink);text-decoration:none;background:none;border:0;padding:0}
.big{font-family:var(--f-cond);font-weight:400;text-transform:uppercase;line-height:.88}
.kpi{display:grid;gap:4px}
.kpi .big{font-size:clamp(34px,3.6vw,48px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:99px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap;transition:transform .15s,background-color .15s}
.btn:hover{transform:translateY(-1px);background:#26262A}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.light{background:#F2F0EB;color:var(--ink);border-color:#F2F0EB}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.grad-b{background:var(--grad);border:0;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:#E6F5EE;color:var(--ok)}
.chip.due{background:#FFF3E2;color:var(--warn)}
.chip.bad{background:#FCEBE9;color:var(--bad)}
.chip.now{background:#EFEAFE;color:var(--vink)}
.chip.info{background:#E8F6FD;color:var(--skyink)}
.chip.off{background:var(--stone);color:var(--mute)}
.field{display:grid;gap:6px;font-size:13px;font-weight:600}
.field input,.field select,.field textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--card);font-weight:400;font-size:14.5px;outline:none}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(158,128,242,.18)}
.toast{position:fixed;left:50%;bottom:24px;z-index:80;transform:translate(-50%,20px);max-width:min(560px,calc(100vw - 32px));padding:12px 18px;border-radius:14px;background:var(--ink);color:#fff;font-size:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{padding:22px;border:1.5px dashed var(--line2);border-radius:14px;text-align:center;color:var(--mute);font-size:14px}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;line-height:1.3}
.row .s{font-size:13px;color:var(--mute)}
.ico{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--stone)}
.ico svg{width:19px;height:19px}

/* ---------- the boarding pass ---------- */
.pass{--notch:16px;display:grid;grid-template-columns:minmax(0,1fr) 230px;border-radius:22px;background:var(--ink);color:#F2F0EB;overflow:hidden;
  -webkit-mask:radial-gradient(circle var(--notch) at calc(100% - 230px) 0,#0000 98%,#000) top / 100% 51% no-repeat,radial-gradient(circle var(--notch) at calc(100% - 230px) 100%,#0000 98%,#000) bottom / 100% 51% no-repeat;
          mask:radial-gradient(circle var(--notch) at calc(100% - 230px) 0,#0000 98%,#000) top / 100% 51% no-repeat,radial-gradient(circle var(--notch) at calc(100% - 230px) 100%,#0000 98%,#000) bottom / 100% 51% no-repeat}
.pass-main{padding:clamp(18px,2.4vw,28px);display:grid;gap:18px;min-width:0}
.pass-top{display:flex;justify-content:space-between;gap:12px;color:#9C9A94}
.pass-top b{color:var(--sky);font-weight:500}
.status{font-family:var(--f-cond);font-weight:400;text-transform:uppercase;font-size:clamp(46px,6.6vw,96px);line-height:.85;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pass-title{margin:0;font-size:clamp(17px,1.6vw,21px);font-weight:600}
.flight{position:relative;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.flight .end{font-family:var(--f-cond);font-size:24px;text-transform:uppercase;line-height:1}
.flight .end small{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:#9C9A94;margin-bottom:4px}
.track{position:relative;height:2px;background:repeating-linear-gradient(90deg,#4A4A50 0 6px,transparent 6px 11px)}
.track i{position:absolute;left:0;top:0;height:2px;background:var(--grad);border-radius:2px}
.track svg{position:absolute;top:50%;width:26px;height:26px;transform:translate(-50%,-50%) rotate(90deg);color:#fff;filter:drop-shadow(0 0 8px rgba(63,184,238,.7))}
.pass-stub{padding:clamp(18px,2.4vw,26px);border-left:2px dashed #3A3A40;display:grid;align-content:space-between;gap:14px}
.stub-row{display:grid;gap:3px}
.stub-row b{font-family:var(--f-cond);font-weight:400;font-size:26px;line-height:1;text-transform:uppercase}
.stub-row b.s{font-family:var(--f);font-weight:700;font-size:16px;text-transform:none}
.bars{display:block;width:100%;height:40px;fill:#F2F0EB}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;padding:0 0 22px}
.tl li:last-child{padding-bottom:0}
.tl .dot{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line2)}
.tl .done .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.tl .now .dot{background:var(--grad);border:0;box-shadow:0 0 0 6px rgba(158,128,242,.18)}
.tl .dot svg{width:15px;height:15px}
.tl .h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.tl .h b{font-weight:900;font-stretch:72%;text-transform:uppercase;font-size:22px;line-height:1}
.tl .next .h b{color:#A9A59C}
.tl p{margin:4px 0 0;font-size:14px;color:#3A3A37}
.review{margin-top:12px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;padding:12px;border-radius:14px;background:var(--stone)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#202024,#3A3348);overflow:hidden;display:grid;place-items:center;color:#fff}
.thumb svg{width:30px;height:30px;opacity:.9}
.review .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* ---------- check-in: what we need ---------- */
.needs{display:grid;gap:12px}
.need{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.need .ico{width:44px;height:44px;border-radius:14px}
.need.received{background:#FBFCFA}
.need.received .t{color:var(--mute);text-decoration:line-through;text-decoration-color:#B9B6AE}
.need .t{font-weight:700}
.need .s{font-size:13px;color:var(--mute)}
.need-body{grid-column:1 / -1;display:grid;gap:10px}
.drop{position:relative;display:grid;place-items:center;gap:6px;padding:26px 16px;border:2px dashed var(--line2);border-radius:16px;background:var(--paper);text-align:center;transition:border-color .2s,background-color .2s}
.drop.over{border-color:var(--violet);background:#F6F2FF}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop b{font-weight:900;font-stretch:72%;text-transform:uppercase;font-size:22px;line-height:1}
.drop small{font-size:12.5px;color:var(--mute)}
.files-q{display:grid;gap:8px}
.fq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--stone);font-size:13px}
.fq .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fq .bar2{grid-column:1 / -1;height:4px;border-radius:4px;background:#DDDAD2;overflow:hidden}
.fq .bar2 i{display:block;height:100%;background:var(--grad);width:0;transition:width .3s}
.bag-ct{display:flex;gap:10px;flex-wrap:wrap}
.bag-ct .card{flex:1 1 140px;padding:14px 16px}

/* ---------- calendar ---------- */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.cal-head h2{font-weight:900;font-stretch:72%;text-transform:uppercase;font-size:clamp(28px,3vw,38px);line-height:.9}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center}
.cal-nav svg{width:16px;height:16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{padding:4px 0;text-align:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--mute)}
.day{position:relative;min-height:84px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
.day:hover{border-color:var(--ink)}
.day.out{background:transparent;border-color:transparent;color:#B9B6AE}
.day.today .n{background:var(--ink);color:#fff}
.day.sel{border-color:var(--violet);box-shadow:0 0 0 2px var(--violet) inset}
.day .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:700}
.ev{display:block;width:100%;padding:2px 6px;border-radius:6px;font-size:11px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.due{background:#FFF0DB;color:#9A5414}
.ev.shoot,.ev.event{background:#E8F6FD;color:var(--skyink)}
.ev.review,.ev.delivery{background:#EFEAFE;color:var(--vink)}
.ev.note{background:var(--stone);color:#4A4A45}
.ev.book{background:var(--ink);color:#fff}
.ev.task{background:#FFF0DB;color:#9A5414}
.ev.done{background:#E6F5EE;color:var(--ok);text-decoration:line-through}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.seg{display:inline-flex;padding:4px;border-radius:99px;background:var(--stone);gap:2px}
.seg button{height:34px;padding:0 14px;border:0;border-radius:99px;background:transparent;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- payments ---------- */
.fare{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end}
.fare .big{font-size:clamp(56px,6.4vw,88px)}
.methods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.method{display:grid;gap:4px;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);text-align:left;transition:border-color .15s,transform .15s}
.method:hover{border-color:var(--ink);transform:translateY(-1px)}
.method[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.method .mk{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.method .mk i{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;color:#fff;font-style:normal;font-size:12px;font-weight:800}
.method small{font-size:12px;color:var(--mute)}
.inv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 16px;align-items:center}

/* ---------- messages / comms ---------- */
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100dvh - 170px);min-height:520px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.chat.single{grid-template-columns:minmax(0,1fr)}
.threads{border-right:1px solid var(--line);overflow:auto;background:var(--paper)}
.threads h3{margin:0;padding:14px 16px 6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
.th{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;border:0;background:transparent;text-align:left}
.th:hover{background:var(--stone)}
.th[aria-current="true"]{background:#EFEAFE}
.th .grow{flex:1;min-width:0}
.th b{display:block;font-size:14px}
.th span{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .hash{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;font-weight:800}
.th .un{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--violet);color:var(--ink);font-size:11px;font-weight:800;display:grid;place-items:center}
.convo{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-width:0}
.convo-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.convo-h b{display:block}
.convo-h span{font-size:12.5px;color:var(--mute)}
.back{display:none;border:0;background:none;padding:6px}
.msgs{overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:
  radial-gradient(circle at 20% 10%,rgba(63,184,238,.06),transparent 40%),radial-gradient(circle at 90% 80%,rgba(158,128,242,.07),transparent 40%),var(--paper)}

}

}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* ---------- uploads: straight from the browser into the Drive, in pieces, picking up where they left off ---------- */
function putFile(url, file, onp){
  const CH = 32 * 1024 * 1024, total = file.size;   // pieces are a multiple of 256 KB, as Google asks
  let off = 0, tries = 0;
  return new Promise((resolve, reject) => {
    const req = (range, body, cb) => {
      const x = new XMLHttpRequest(); x.open('PUT', url);
      if (range) x.setRequestHeader('Content-Range', range);
      if (body && x.upload) x.upload.onprogress = e => onp(Math.min(99.5, (off + e.loaded) / Math.max(1, total) * 100));
      x.onload = () => cb(null, x); x.onerror = () => cb(new Error('network'), x);
      x.send(body || null);
    };
    const finish = x => { try { resolve(JSON.parse(x.responseText)); } catch (e) { reject(new Error('Drive did not confirm the upload.')); } };
    const retry = () => { if (++tries > 8) return reject(new Error('The connection keeps dropping. Try again on a steadier connection.')); setTimeout(resume, Math.min(30000, 1000 * 2 ** tries)); };
    const resume = () => req(`bytes */${total}`, null, (err, x) => {      // ask how much Drive already has
      if (err || x.status >= 500) return retry();
      if (x.status === 200 || x.status === 201) return finish(x);
      if (x.status === 308){ const r = x.getResponseHeader('Range'); if (r) off = +r.split('-')[1] + 1; return send(); }
      reject(new Error('That upload expired. Please add the file again.'));
    });
    const send = () => {
      if (!total) return req(null, file, (err, x) => (err ? retry() : x.status < 300 ? finish(x) : reject(new Error('Upload failed (' + x.status + ')'))));
      const end = Math.min(off + CH, total);
      req(`bytes ${off}-${end - 1}/${total}`, file.slice(off, end), (err, x) => {
        if (err || x.status >= 500) return retry();
        if (x.status === 308){ tries = 0; const r = x.getResponseHeader('Range'); off = r ? +r.split('-')[1] + 1 : end; onp(off / total * 100); return send(); }
        if (x.status === 200 || x.status === 201) return finish(x);
        reject(new Error('Upload failed (' + x.status + ')'));
      });
    };
    send();
  });
}
async function sendFile(qid, file, extra){
  const q = document.querySelector(`[data-q="${qid}"]`);
  const el = document.createElement('div'); el.className = 'fq';
  el.innerHTML = `<span class="n">${esc(file.name)}</span><span class="mute">${mb(file.size)} · starting</span><span class="bar2"><i></i></span>`;
  if (q) q.appendChild(el);

async function voice(btn){
  if (REC){ REC.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Voice notes need a newer browser.');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { return toast('The microphone is blocked. Allow it in your browser settings.'); }
  const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined), chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); REC = null; render(true);
    const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
    if (blob.size < 2000) return toast('That was too short to send.');
    const stamp = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(':', '.');
    attach(new File([blob], `Voice note ${stamp}.${(rec.mimeType || '').includes('mp4') ? 'm4a' : 'webm'}`, { type: blob.type }));
  };

}

    await api('review', { action, notes, project: projCode() });
    if (C.review) C.review.state = action === 'approve' ? 'Approved' : 'Notes sent';
    closeModal(); toast(action === 'approve' ? 'Approved. Thank you!' : 'Notes sent to the crew.'); refresh(true);
  } catch (e) { busy(b, false); toast(e.message); }
}
async function openFile(id){
  if (!id) return toast('That file is still on its way to the Drive.');
  const w = window.open('about:blank', '_blank');
  try { const j = await api('file?id=' + encodeURIComponent(id)); if (w) w.location.href = j.view; else location.href = j.view; }
  catch (e) { if (w) w.close(); toast(e.message); }
}
async function saveProfile(b){
  const main = $('#main'), side = route().side, me = DATA[side].me, data = { socials: {} };
  main.querySelectorAll('[data-f]').forEach(i => { data[i.dataset.f] = i.value.trim(); });
  main.querySelectorAll('[data-soc]').forEach(i => { data.socials[i.dataset.soc] = i.value.trim(); });
  if (side === 'client'){ data.prefs = {}; main.querySelectorAll('[data-pref]').forEach(i => { data.prefs[i.dataset.pref] = i.checked; }); }
  else data.skills = me.skills;
  busy(b, true, 'Saving…');
  try {
    await api('profile', data);
    ['name', 'company', 'role', 'city', 'bio', 'tz'].forEach(k => { if (data[k] !== undefined) me[k] = data[k]; });
    Object.assign(me.socials, data.socials); if (data.prefs) Object.assign(me.prefs, data.prefs);
    toast('Saved.'); render(true);
  } catch (e) { busy(b, false); toast(e.message); }
}

/* ---------- payments ---------- */
async function startPay(invoices){
  const m = STATE.pay;
  const list = C.invoices.filter(i => i.status === 'due' && (!invoices || invoices.includes(i.no)));
  const total = list.reduce((a, i) => a + i.amount, 0), nos = list.map(i => i.no);
  if (!list.length) return toast('Nothing is due right now.');
  if (!m){ toast('Pick how you\'d like to pay first.'); const f = document.querySelector('.method'); if (f) f.focus(); return; }
  const P = CONFIG.pay, body = { invoices: nos, project: projCode() };
  try {
    if (m === 'card' || m === 'apple' || (m === 'cashapp' && P.cashapp)){ toast('Opening secure checkout…'); const j = await api('pay/stripe', { ...body, method: m === 'cashapp' ? 'cashapp' : 'card' }); location.href = j.url; }
    else if (m === 'square'){ toast('Opening Square…'); const j = await api('pay/square', body); location.href = j.url; }
    else if (m === 'paypal' || m === 'venmo') paypalModal(m, nos, total);
    else manualModal(m, nos, total);
  } catch (e) { toast(e.message); }
}
function pickInvoice(){
  const due = C.invoices.filter(i => i.status === 'due');
  if (!due.length) return toast('Nothing is due right now.');
  if (!STATE.pay) return toast('Pick how you\'d like to pay first.');
  modal(`<h3 id="sheetTitle">Pay one invoice</h3><div class="paylist">${due.map((i, k) => `<label><input type="radio" name="inv" value="${esc(i.no)}" ${k ? '' : 'checked'}><span><span style="font-weight:700">${esc(i.label)}</span><br><span class="mono mute" style="font-size:10px">${esc(i.no)} · due ${fmt(i.due)}</span></span><b>${money(i.amount)}</b></label>`).join('')}</div><div class="acts"><button class="btn" type="button" data-act="pay-go">Continue</button><button class="btn ghost" type="button" data-close>Cancel</button></div>`);
}
function loadPayPal(){
  if (window.paypal) return Promise.resolve(window.paypal);
  return ppLoad || (ppLoad = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(CONFIG.pay.paypal) + '&currency=USD&intent=capture&components=buttons&enable-funding=venmo';
    s.onload = () => res(window.paypal); s.onerror = () => { ppLoad = null; rej(new Error('PayPal did not load. Check your connection.')); };
    document.head.appendChild(s);
  }));
}
async function paypalModal(m, nos, total){
  const name = m === 'venmo' ? 'Venmo' : 'PayPal';
  modal(`<h3 id="sheetTitle">Pay ${money(total)} with ${name}</h3><p class="mute" style="margin:0 0 14px;font-size:14px">A secure ${name} window opens to finish up, then you land right back here.</p><div id="ppBtns" style="min-height:50px">Loading…</div><div class="acts"><button class="btn ghost" type="button" data-close>Cancel</button></div>`);
  try {
    const pp = await loadPayPal(), box = $('#ppBtns'); if (!box) return;
    box.textContent = '';
    const btn = pp.Buttons({
      fundingSource: m === 'venmo' ? pp.FUNDING.VENMO : pp.FUNDING.PAYPAL, style: { shape: 'pill', height: 48 },
      createOrder: () => api('pay/paypal/create', { invoices: nos, project: projCode() }).then(j => j.id),
      onApprove: d => api('pay/paypal/capture', { id: d.orderID }).then(j => { closeModal(); toast(j.paid ? 'Paid. Thank you! Your receipt is on its way.' : 'PayPal didn\'t finish that payment.'); refresh(true); }, e => toast(e.message)),
      onError: () => toast('PayPal hit a snag. Try again, or pick another way to pay.')
    });
    if (!btn.isEligible()){ box.innerHTML = `<p style="font-size:14px;margin:0">${m === 'venmo' ? 'Venmo shows up on phones in the US. On this device, pick PayPal instead.' : 'PayPal isn\'t available on this device.'}</p>`; return; }
    btn.render('#ppBtns');
  } catch (e) { const box = $('#ppBtns'); if (box) box.textContent = e.message; }
}
function manualModal(m, nos, total){
  const P = CONFIG.pay, zelle = m === 'zelle', handle = zelle ? P.zelle : P.cashtag;
  const link = !zelle && P.cashtag ? 'https://cash.app/' + encodeURIComponent('$' + P.cashtag.replace(/^\$/, '')) + '/' + total.toFixed(2) : '';
  modal(`<h3 id="sheetTitle">Pay with ${zelle ? 'Zelle' : 'Cash App'}</h3><p style="margin:0;font-size:15px">Send <b>${money(total)}</b> ${zelle ? 'from your bank app' : 'in Cash App'} to:</p>
    <div class="handle"><span>${esc(handle)}</span><button class="btn sm ghost" type="button" data-copy="${esc(handle)}">Copy</button></div>
    <p style="margin:0;font-size:14px">Put <b>${esc(nos.join(', '))}</b> in the memo so we can match it.</p>${link ? `<p style="margin:12px 0 0"><a class="btn sm ghost" href="${esc(link)}" target="_blank" rel="noopener">Open Cash App</a></p>` : ''}
    <div class="acts"><button class="btn" type="button" data-act="paid-manual" data-m="${m}" data-nos="${esc(nos.join(','))}">I sent it</button><button class="btn ghost" type="button" data-close>Not yet</button></div>`);
}
async function manualSent(b){
  const nos = b.dataset.nos.split(',');
  busy(b, true, 'Telling the crew…');
  try {
    await api('pay/manual', { method: b.dataset.m, invoices: nos, project: projCode() });
    C.invoices.forEach(i => { if (nos.includes(i.no)){ i.status = 'sent'; i.via = b.dataset.m === 'zelle' ? 'Zelle' : 'Cash App'; } });
    closeModal(); toast('Thanks! We\'ll confirm as soon as it lands.'); render(true);
  } catch (e) { busy(b, false); toast(e.message); }
}

/* ---------- crew actions ---------- */
async function liveTask(id){
  const t = T.tasks.find(x => x.id === id); if (!t) return;
  if (STATE.viewAs) return toast('This is a view-only copy.');
  const prev = t.status; t.status = prev === 'done' ? 'todo' : 'done'; render(true);
  try { const j = await api('tasks/toggle', { id }); t.status = j.status; toast(j.status === 'done' ? 'Nice. Nate gets a heads-up that it\'s done.' : 'Moved back to your list.'); }
  catch (e) { t.status = prev; toast(e.message); }
  render(true);
}
function payoutModal(){
  const me = T.me, methods = ['Wise', 'PayPal', 'Zelle', 'Direct deposit', 'Other'];
  modal(`<h3 id="sheetTitle">Payout method</h3><p class="mute" style="margin:0 0 12px;font-size:14px">How you'd like to be paid. Works for crew in any country.</p>
    <div class="grid" style="gap:10px"><label class="field">Method<select id="pm">${methods.map(x => `<option ${me.payout.method === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
    <label class="field">Account email, or the last 4 digits<input id="pd" type="text" value="${esc(/^Add how/.test(me.payout.detail) ? '' : me.payout.detail)}" placeholder="name@email.com"></label></div>
    <p class="mute" style="font-size:12.5px">Full bank details go on the payout provider's own secure page, never here.</p>
    <div class="acts"><button class="btn" type="button" data-act="save-payout">Save</button><button class="btn ghost" type="button" data-close>Cancel</button></div>`);
}
async function savePayout(b){
  const method = $('#pm').value, detail = $('#pd').value.trim();
  busy(b, true, 'Saving…');
  try { await api('payout-method', { method, detail }); T.me.payout = { method, detail }; closeModal(); toast('Payout method saved.'); render(true); }
  catch (e) { busy(b, false); toast(e.message); }
}
function hoursModal(){
  const projects = (T.folders || []).filter(f => !['General', 'Drone footage', 'Music and sound'].includes(f)).concat(['Other']);
  modal(`<h3 id="sheetTitle">Submit hours</h3><div class="grid" style="gap:10px"><label class="field">Project<select id="hp">${projects.map(x => `<option>${esc(x)}</option>`).join('')}</select></label>
    <div class="grid g2" style="gap:10px"><label class="field">Days<input id="hd" type="number" value="1" min="0" step="0.5"></label><label class="field">Extra costs ($)<input id="hx" type="number" value="0" min="0"></label></div>
    <label class="field">What you did<textarea id="hn" placeholder="Teaser v2, export for color"></textarea></label></div>
    <p class="mute" style="font-size:12.5px">${T.pay.rate ? esc(T.pay.rate) + '. ' : ''}Nate approves it, then it's scheduled to pay out.</p>
    <div class="acts"><button class="btn" type="button" data-act="sent-hours">Submit</button><button class="btn ghost" type="button" data-close>Cancel</button></div>`);
}
async function sendHours(b){
  const v = { project: $('#hp').value, days: +$('#hd').value || 0, extra: +$('#hx').value || 0, note: $('#hn').value.trim() };
  busy(b, true, 'Submitting…');
  try {
    const j = await api('hours', v);
    T.pay.payouts.unshift({ id: j.id, label: [v.project, v.note].filter(Boolean).join(': '), amount: j.amount, date: '', status: 'submitted' });
    T.pay.pending += j.amount; closeModal(); toast('Submitted to Nate for approval.'); render(true);
  } catch (e) { busy(b, false); toast(e.message); }
}
function skillModal(){
  modal(`<h3 id="sheetTitle">Add a skill</h3><label class="field">Skill<input id="skillIn" placeholder="e.g. After Effects" maxlength="40"></label><div class="acts"><button class="btn" type="button" data-act="save-skill">Add</button><button class="btn ghost" type="button" data-close>Cancel</button></div>`);
}
async function saveSkill(){
  const v = ($('#skillIn').value || '').trim(); if (!v) return;
  T.me.skills.push(v); closeModal(); render(true);
  try { await api('profile', { skills: T.me.skills }); toast('Added to your crew card.'); } catch (e) { toast(e.message); }
}

/* ---------- admin (crew members marked admin on the Team tab) ---------- */
function adminCard(){
  if (!CONFIG.live || !T.admin) return '';
  const A = T.admin;
  return `<section class="card"><div class="c-head"><h2>Admin</h2><span class="mute" style="font-size:13px">Only admins see this</span></div>
    ${A.clients.length ? `<label class="field">See a client's portal<select id="asClient">${A.clients.map(c => `<option value="${esc(c.email)}">${esc(c.code)} · ${esc(c.title)}</option>`).join('')}</select></label>` : ''}
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">${A.clients.length ? '<button class="btn sm" type="button" data-act="view-as">Open client view</button>' : ''}<button class="btn sm ghost" type="button" data-act="kudos">Send a thank-you</button><a class="btn sm ghost" href="#/team/payroll">Crew pay${A.approvals.length ? ' · ' + A.approvals.length : ''}</a></div></section>`;
}
function adminPay(){
  if (!CONFIG.live || !T.admin) return '';
  const A = T.admin;
  const row = (p, act, label) => `<li class="row"><span class="grow"><span class="t">${esc(p.who)}: ${esc(p.label)}</span><br><span class="s">${p.note && !p.label.includes(p.note) ? esc(p.note) + ' · ' : ''}${p.date ? 'Scheduled ' + fmt(p.date) : 'Waiting on you'}</span></span><b>${money(p.amount)}</b><button class="btn sm${act === 'mark-paid' ? ' ghost' : ''}" type="button" data-act="${act}" data-id="${esc(p.id)}">${label}</button></li>`;
  return `<section class="card"><div class="c-head"><h2>Crew pay</h2><span class="mute" style="font-size:13px">Approve hours, then mark them paid once the money is sent</span></div>${A.approvals.length || A.scheduled.length ? `<ul class="list">${A.approvals.map(p => row(p, 'approve-pay', 'Approve')).join('')}${A.scheduled.map(p => row(p, 'mark-paid', 'Mark paid')).join('')}</ul>` : '<div class="empty">Nothing waiting. Hours show up here when the crew submits them.</div>'}</section>`;
}
async function adminDo(b, path, msg){
  busy(b, true, '…');
  try { await api(path, { id: b.dataset.id }); toast(msg); refresh(true); } catch (e) { busy(b, false); toast(e.message); }
}
function kudosModal(){
  modal(`<h3 id="sheetTitle">Send a thank-you</h3><div class="grid" style="gap:10px"><label class="field">To<select id="kto">${T.admin.crew.map(c => `<option value="${esc(c.key)}">${esc(c.name)}</option>`).join('')}</select></label><label class="field">Your note<textarea id="ktx" placeholder="What they did, and why it mattered"></textarea></label></div><p class="mute" style="font-size:12.5px">It's emailed to them and saved on their crew card.</p><div class="acts"><button class="btn" type="button" data-act="send-kudos">Send</button><button class="btn ghost" type="button" data-close>Cancel</button></div>`);
}
async function sendKudos(b){
  const text = $('#ktx').value.trim(); if (!text) return toast('Write the note first.');
  busy(b, true, 'Sending…');
  try { await api('admin/kudos', { to: $('#kto').value, text }); closeModal(); toast('Sent. It\'s in their inbox and on their crew card.'); }
  catch (e) { busy(b, false); toast(e.message); }
}

/* ---------- the bell ---------- */
function showNotes(){
  const r = route(), items = [];
  if (r.side === 'client' && C.project){
    C.needs.filter(n => n.status !== 'received' && daysTo(n.due) <= 3).forEach(n => items.push([daysTo(n.due) < 0 ? 'bad' : 'due', n.label + (daysTo(n.due) < 0 ? ' is overdue' : ' is due ' + rel(n.due).toLowerCase()), '#/client/checkin']));
    if (C.review && !/approved/i.test(C.review.state || '')) items.push(['now', C.review.title + ' is ready for your notes', '#/client/timeline']);
    (C.documents || []).filter(d => d.status === 'to sign').forEach(d => items.push(['due', d.title + ' needs your signature', '#/client/docs']));
    if (r.page !== 'messages' && (CONFIG.live ? C.unread : 0)) items.push(['info', C.unread + ' new message' + (C.unread === 1 ? '' : 's'), '#/client/messages']);
    const due = C.invoices.filter(i => i.status === 'due' && daysTo(i.due) <= 7);
    if (due.length) items.push(['due', money(due.reduce((a, i) => a + i.amount, 0)) + ' due ' + rel(due[0].due).toLowerCase(), '#/client/fare']);
  } else if (r.side === 'team'){
    T.tasks.filter(t => t.status !== 'done' && daysTo(t.due) <= 2).forEach(t => items.push([daysTo(t.due) < 0 ? 'bad' : 'due', t.title + (daysTo(t.due) < 0 ? ' is overdue' : ' is due ' + rel(t.due).toLowerCase()), '#/team/callsheet']));
    T.channels.filter(c => c.unread).forEach(c => items.push(['info', c.unread + ' new in ' + (c.kind === 'channel' ? '#' : '') + c.name, '#/team/comms']));
    if (T.admin && T.admin.approvals.length) items.push(['now', T.admin.approvals.length + ' crew payout' + (T.admin.approvals.length === 1 ? '' : 's') + ' to approve', '#/team/payroll']);
  }
  const label = { bad: 'Late', due: 'Soon', now: 'Ready', info: 'New' };
  modal(`<h3 id="sheetTitle">Updates</h3>${items.length ? `<ul class="list">${items.map(([k, t, h]) => `<li><a class="row" href="${h}" data-close style="text-decoration:none"><span class="chip ${k}" style="flex:none">${label[k]}</span><span class="grow t">${esc(t)}</span></a></li>`).join('')}</ul>` : '<p class="mute" style="margin:0">You\'re all caught up.</p>'}<div class="acts"><button class="btn ghost" type="button" data-close>Close</button></div>`);
}

const LIVE = {
  'submit-need': submitNeed,
  watch: watchCut,
  'send-notes': b => reviewCut(b, 'notes'),
  approved: b => reviewCut(b, 'approve'),
  pay: () => startPay(),
  'pay-part': pickInvoice,
  'pay-go': () => { const v = ($('#sheet input[name=inv]:checked') || {}).value; if (!v) return toast('Pick an invoice.'); closeModal(); startPay([v]); },
  'paid-manual': manualSent,
  receipts: () => { window.open(API + 'receipt' + (projCode() ? '?project=' + encodeURIComponent(projCode()) : ''), '_blank'); },
  dl: b => openFile(b.dataset.id),
  save: saveProfile,
  signout: () => { api('auth/logout', {}).catch(() => {}).then(() => { location.href = 'portal.html'; }); },
  attach: () => { pickFile().then(f => { if (f) attach(f); }); },
  voice: voice,
  'payout-method': payoutModal, 'save-payout': savePayout,
  'submit-invoice': hoursModal, 'sent-hours': sendHours,
  'add-skill': skillModal, 'save-skill': saveSkill,
  photo: () => { pickFile('image/*').then(async f => {
    if (!f) return;
    if (f.size > 4e6) return toast('Pick a photo under 4 MB.');
    try { const done = await sendFile('photo', f, { folder: 'Profile photos' }); await api('profile', { photo: done.id }); toast('Photo saved.'); refresh(true); }
    catch (e) { toast(e.message); }
  }); },
  'approve-pay': b => adminDo(b, 'admin/payout/approve', 'Approved. They\'ve been emailed the payout date.'),
  'mark-paid': b => adminDo(b, 'admin/payout/paid', 'Marked paid. They\'ve been emailed.'),
  kudos: kudosModal, 'send-kudos': sendKudos,
  'view-as': () => { const v = ($('#asClient') || {}).value; if (v) window.open('portal-app.html?as=' + encodeURIComponent(v) + '#/client/overview', '_blank'); }
};
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (!c) return;
  (navigator.clipboard ? navigator.clipboard.writeText(c.dataset.copy) : Promise.reject()).then(() => toast('Copied.'), () => toast(c.dataset.copy));
});
document.addEventListener('keydown', e => { if (e.target.id === 'skillIn' && e.key === 'Enter'){ e.preventDefault(); saveSkill(); } });
window.addEventListener('hashchange', () => { markClientRead(); });

async function boot(){
  const qs = new URLSearchParams(location.search);
  STATE.viewAs = qs.get('as') || ''; STATE.project = qs.get('project') || '';
  if (qs.has('preview')){ STATE.viewAs = ''; return render(); }
  $('#main').innerHTML = '<div class="boot"><div><b>Boarding</b><span>Getting your portal ready…</span></div></div>';
  let r;
  try { r = await fetch(API + 'portal' + query(), { credentials: 'same-origin', headers: { Accept: 'application/json' } }); }
  catch (e) { STATE.viewAs = ''; return render(); }
  const isJson = (r.headers.get('content-type') || '').includes('application/json');
  if (r.status === 401 && isJson){ location.replace('portal.html'); return; }
  if (r.status === 503 && isJson){ location.replace('portal.html'); return; }   // the real site, before its accounts are connected
  if (!r.ok && isJson){
    $('#main').innerHTML = '<div class="boot"><div><b>We couldn\'t load your portal</b><span>Refresh in a minute. If it keeps happening, <a href="contact.html">let us know</a>.</span></div></div>';
    return;
  }
  if (!r.ok || !isJson){ STATE.viewAs = ''; return render(); }        // no portal API here, so this is a preview
  take(await r.json());
  const want = '#/' + CONFIG.side + '/';
  if (!location.hash.startsWith(want)) history.replaceState(null, '', location.pathname + location.search + want + NAV[CONFIG.side][0][0]);
  render();
  const paid = qs.get('paid');                                           // back from a checkout page
  if (paid){
    history.replaceState(null, '', location.pathname + (STATE.viewAs ? '?as=' + encodeURIComponent(STATE.viewAs) : '') + location.hash);
    const check = paid === 'stripe' ? api('pay/stripe/check?session=' + encodeURIComponent(qs.get('session') || '')) : paid === 'square' ? api('pay/square/check', {}) : null;
    if (check) check.then(j => { toast(j.paid ? 'Payment received. Thank you! Your receipt is on its way.' : 'Your payment is processing. We\'ll email your receipt.'); refresh(true); }, e => toast(e.message));
  }
  markClientRead();
  setInterval(poll, 8000);
  setInterval(() => refresh(), 180000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  window.addEventListener('beforeunload', e => { if (PENDING){ e.preventDefault(); e.returnValue = ''; } });
}

boot();
})();
</script>
